# commit-tier-calc.sh(전역) 프로젝트 확장 축 — 없으면 전역 기본 축(ⓐ서버 소스 ⓑ매퍼 XML ⓒ템플릿 <script> ⓓ템플릿 바인딩)만 본다.
# 개발 소유 화면 JS(상태·요청·DOM 조립 로직)는 기본 축에 없어, 그것만 바뀐 커밋이 B티어 후보로 나온다(원 레포 2026-09-18 실측).
# 형식: `키=값` 한 줄(훅이 source 하지 않고 파싱만 한다). 값은 공백 구분 셸 글롭(case 매칭 — * 는 / 도 먹는다).
# ⚠️ 설치 시 이 레포의 개발 소유 JS 경로로 확정할 것(퍼블 소유 JS 는 넣지 않는다).
extra_a_globs=*/js/develop/*.js
